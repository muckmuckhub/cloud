name: Docs

# Builds the docs site and publishes it to GitHub Pages.
#
# Enable it once in the repository, or nothing is published:
#
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# https://github.com/muckmuckhub/cloud/settings/pages
#
# Until that is done the build still runs and the deploy step is skipped with a
# warning, so a broken docs change fails CI while an unconfigured fork does not.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Without this, setup-python looks for **/requirements.txt or
          # **/pyproject.toml, finds neither in a Bun repository, and fails
          # before installing anything.
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      # --strict fails on a broken internal link or a page missing from the
      # nav, so the site cannot ship with a dead link in it.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages fails with a bare 404 and an octokit stack trace when
      # Pages has never been enabled, which reads like a broken workflow rather
      # than an unticked setting. Ask the API first and say what to click.
      #
      # Only a 404 means "not enabled". Anything else — a permissions quirk, a
      # transient API error — falls through to the deploy, so this check can
      # never silently stop publishing.
      - name: Is Pages enabled?
        id: pages
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::The site built fine but was not published. Enable it once at https://github.com/${{ github.repository }}/settings/pages - under 'Build and deployment' set Source to 'GitHub Actions' - then re-run this job."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
