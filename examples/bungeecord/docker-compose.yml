# GENERATED by `cloud apply` — DO NOT EDIT.
# Source of truth is cloud.toml. Changes here are overwritten.

services:
  proxy:
    image: itzg/mc-proxy:java17
    container_name: bungee-example-proxy
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      TYPE: "BUNGEECORD"
      MEMORY: "512m"
      REPLACE_ENV_VARIABLES: "true"
      REPLACE_ENV_VARIABLE_PREFIX: "CFG_"
      CFG_MOTD: "A BungeeCord Network"
      PLUGINS: "https://github.com/Aeltumn/BungeeGuard/releases/latest/download/BungeeGuard.jar"
      CLOUD_NETWORK: "bungee-example"
      CLOUD_INSTANCE: "proxy"
      CLOUD_SERVERS: "lobby-1,lobby-2,survival"
    ports:
      # The proxy is the ONLY service with published ports. Backends stay
      # on the internal network — see README, "No backend ports".
      - "${ENTRY_PORT:-25565}:25565"
    volumes:
      - ./proxy/config.yml:/config/config.yml:ro
      - proxy-data:/server
      - ./data/proxy/plugins:/server/plugins
    networks: [cloud]

  lobby-1:
    image: itzg/minecraft-server:java21
    container_name: bungee-example-lobby-1
    restart: unless-stopped
    mem_limit: 2560m
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.10"
      MEMORY: "2G"
      SERVER_NAME: "lobby-1"
      ONLINE_MODE: "FALSE"
      PATCH_DEFINITIONS: "/patches"
      REPLACE_ENV_IN_PLACE: "true"
      REPLACE_ENV_VARIABLE_PREFIX: "CFG_"
      CFG_VELOCITY_ENABLED: "false"
      CFG_VELOCITY_ONLINE_MODE: "true"
      CFG_BUNGEE_ENABLED: "true"
      CFG_BUNGEE_ONLINE_MODE: "true"
      CFG_FORWARDING_SECRET: "${FORWARDING_SECRET:?run `cloud apply` to generate one}"
      PLUGINS: "https://github.com/Aeltumn/BungeeGuard/releases/latest/download/BungeeGuard.jar"
      COPY_CONFIG_DEST: "/data"
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      CLOUD_NETWORK: "bungee-example"
      CLOUD_GROUP: "lobby"
      CLOUD_INSTANCE: "lobby-1"
      CLOUD_INSTANCE_INDEX: "1"
      CLOUD_GROUP_SIZE: "2"
      CLOUD_STATIC: "false"
      CLOUD_FALLBACK: "lobby-1"
      CLOUD_GROUPS: "lobby,survival"
      CLOUD_SERVERS: "lobby-1,lobby-2,survival"
      CLOUD_PROXY: "bungee-example-proxy"
    expose:
      - "25565"
    volumes:
      - lobby-1-data:/data
      - ./data/lobby-1/plugins:/data/plugins
      # templates/lobby/ owns these files. Edit them there, not in
      # ./data/lobby-1/ — this copy is overwritten on every start.
      - ./templates/lobby:/config:ro
      - ./proxy/patches:/patches:ro
    networks: [cloud]

  lobby-2:
    image: itzg/minecraft-server:java21
    container_name: bungee-example-lobby-2
    restart: unless-stopped
    mem_limit: 2560m
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.10"
      MEMORY: "2G"
      SERVER_NAME: "lobby-2"
      ONLINE_MODE: "FALSE"
      PATCH_DEFINITIONS: "/patches"
      REPLACE_ENV_IN_PLACE: "true"
      REPLACE_ENV_VARIABLE_PREFIX: "CFG_"
      CFG_VELOCITY_ENABLED: "false"
      CFG_VELOCITY_ONLINE_MODE: "true"
      CFG_BUNGEE_ENABLED: "true"
      CFG_BUNGEE_ONLINE_MODE: "true"
      CFG_FORWARDING_SECRET: "${FORWARDING_SECRET:?run `cloud apply` to generate one}"
      PLUGINS: "https://github.com/Aeltumn/BungeeGuard/releases/latest/download/BungeeGuard.jar"
      COPY_CONFIG_DEST: "/data"
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      CLOUD_NETWORK: "bungee-example"
      CLOUD_GROUP: "lobby"
      CLOUD_INSTANCE: "lobby-2"
      CLOUD_INSTANCE_INDEX: "2"
      CLOUD_GROUP_SIZE: "2"
      CLOUD_STATIC: "false"
      CLOUD_FALLBACK: "lobby-1"
      CLOUD_GROUPS: "lobby,survival"
      CLOUD_SERVERS: "lobby-1,lobby-2,survival"
      CLOUD_PROXY: "bungee-example-proxy"
    expose:
      - "25565"
    volumes:
      - lobby-2-data:/data
      - ./data/lobby-2/plugins:/data/plugins
      # templates/lobby/ owns these files. Edit them there, not in
