# A BungeeCord network, for the case where a plugin you depend on has no
# Velocity build. Velocity is the better default; this exists so the
# alternative is a supported path rather than a half-rendered one.
#
# The important difference is forwarding. Modern forwarding is a Velocity
# protocol and does not exist in BungeeCord, so this uses "bungeeguard":
# BungeeCord-style forwarding plus a token that the BungeeGuard plugin checks
# on both ends. Plain "legacy" also works and needs no plugin, but then the
# only thing keeping strangers out of your backends is that no port is
# published for them.

[network]
name       = "bungee-example"
entry_port = 25565
motd       = "A BungeeCord Network"
forwarding = "bungeeguard"     # not "modern" — that is Velocity-only
online     = true

[proxy]
software = "bungeecord"        # or "waterfall"
version  = "latest"            # tracks the image's build; pins Velocity only
memory   = "512m"

# BungeeGuard has to be installed on the proxy as well as on every backend,
# and both sides need the token from proxy/forwarding.secret.
plugins  = ["https://github.com/Aeltumn/BungeeGuard/releases/latest/download/BungeeGuard.jar"]

[groups.lobby]
software = "paper"
version  = "1.21.10"
memory   = "2G"
min      = 2                   # two instances: lobby-1, lobby-2
fallback = true                # players land here; failover target
# Both instances are seeded from templates/lobby/ on every start, so one edit
# there reaches all of them. The template owns those files — editing the copies
# under data/lobby-1/ is pointless, they are overwritten on the next start.
template = "lobby"
plugins  = ["https://github.com/Aeltumn/BungeeGuard/releases/latest/download/BungeeGuard.jar"]

[groups.survival]
software = "paper"
version  = "1.21.10"
memory   = "4G"
min      = 1
static   = true                # keeps its world across restarts
plugins  = ["https://github.com/Aeltumn/BungeeGuard/releases/latest/download/BungeeGuard.jar"]
