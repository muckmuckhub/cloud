# BungeeGuard checks that incoming connections carry a known token.
#
# The token is NOT here, and does not need to be: `cloud apply` sets
# allowed-tokens to the forwarding secret on every start, after this template
# is copied in. Keeping the credential out of a file that lives in git is the
# point. What belongs here is everything else — the kick messages, say.
invalid-token-kick-message: "&cUnable to authenticate with the lobby."
