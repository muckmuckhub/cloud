# Seeded into every instance of the lobby group on each start by `cloud apply`.
# templates/lobby/ mirrors the server directory, so this file lands at
# /data/server.properties inside each container.
#
# Note that most of what you would put here is better set as environment
# variables in [groups.lobby.env] — the image writes server.properties from
# those. Use a template for files no environment variable covers, which in
# practice means plugin configuration.
difficulty=peaceful
spawn-protection=0
allow-nether=false
