# GENERATED by `cloud apply` — DO NOT EDIT.
# Source of truth is cloud.toml. Changes here are overwritten.

services:
  proxy:
    image: itzg/mc-proxy:java21
    container_name: modded-example-proxy
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      TYPE: "VELOCITY"
      MEMORY: "512m"
      REPLACE_ENV_VARIABLES: "true"
      REPLACE_ENV_VARIABLE_PREFIX: "CFG_"
      CFG_MOTD: "Paper lobby, Fabric survival, NeoForge create"
      VELOCITY_VERSION: "3.5.1"
      CFG_FORWARDING_SECRET: "${FORWARDING_SECRET:?run `cloud apply` to generate one}"
      CLOUD_NETWORK: "modded-example"
      CLOUD_INSTANCE: "proxy"
      CLOUD_SERVERS: "lobby,survival,create"
    ports:
      # The proxy is the ONLY service with published ports. Backends stay
      # on the internal network — see README, "No backend ports".
      - "${ENTRY_PORT:-25565}:25565"
    volumes:
      - ./proxy/velocity.toml:/config/velocity.toml:ro
      - ./proxy/forwarding.secret:/config/forwarding.secret:ro
      - proxy-data:/server
      - ./data/proxy/plugins:/server/plugins
    networks: [cloud]

  lobby:
    image: itzg/minecraft-server:java21
    container_name: modded-example-lobby
    restart: unless-stopped
    mem_limit: 2560m
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.10"
      MEMORY: "2G"
      SERVER_NAME: "lobby"
      ONLINE_MODE: "FALSE"
      PATCH_DEFINITIONS: "/patches"
      REPLACE_ENV_IN_PLACE: "true"
      REPLACE_ENV_VARIABLE_PREFIX: "CFG_"
      CFG_VELOCITY_ENABLED: "true"
      CFG_VELOCITY_ONLINE_MODE: "true"
      CFG_BUNGEE_ENABLED: "false"
      CFG_BUNGEE_ONLINE_MODE: "false"
      CFG_FORWARDING_SECRET: "${FORWARDING_SECRET:?run `cloud apply` to generate one}"
      CLOUD_NETWORK: "modded-example"
      CLOUD_GROUP: "lobby"
      CLOUD_INSTANCE: "lobby"
      CLOUD_INSTANCE_INDEX: "1"
      CLOUD_GROUP_SIZE: "1"
      CLOUD_STATIC: "false"
      CLOUD_FALLBACK: "lobby"
      CLOUD_GROUPS: "lobby,survival,create"
      CLOUD_SERVERS: "lobby,survival,create"
      CLOUD_PROXY: "modded-example-proxy"
    expose:
      - "25565"
    volumes:
      - lobby-data:/data
      - ./data/lobby/plugins:/data/plugins
      - ./proxy/patches:/patches:ro
    networks: [cloud]

  survival:
    image: itzg/minecraft-server:java21
    container_name: modded-example-survival
    restart: unless-stopped
    mem_limit: 5120m
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.10"
      MEMORY: "4G"
      SERVER_NAME: "survival"
      ONLINE_MODE: "FALSE"
      FABRIC_PROXY_SECRET: "${FORWARDING_SECRET:?run `cloud apply` to generate one}"
      FABRIC_PROXY_HACK_MESSAGE_CHAIN: "true"
      FABRIC_PROXY_HACK_EARLY_SEND: "true"
      MODRINTH_PROJECTS: "fabricproxy-lite:v2.11.0,lithium:mc1.21.10-0.20.1-fabric"
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      CLOUD_NETWORK: "modded-example"
      CLOUD_GROUP: "survival"
      CLOUD_INSTANCE: "survival"
      CLOUD_INSTANCE_INDEX: "1"
      CLOUD_GROUP_SIZE: "1"
      CLOUD_STATIC: "true"
      CLOUD_FALLBACK: "lobby"
      CLOUD_GROUPS: "lobby,survival,create"
      CLOUD_SERVERS: "lobby,survival,create"
      CLOUD_PROXY: "modded-example-proxy"
    expose:
      - "25565"
    volumes:
      - ./data/survival:/data
    networks: [cloud]

  create:
    image: itzg/minecraft-server:java21
    container_name: modded-example-create
    restart: unless-stopped
    mem_limit: 7680m
    environment:
      EULA: "TRUE"
      TYPE: "NEOFORGE"
      VERSION: "1.21.1"
      MEMORY: "6G"
      SERVER_NAME: "create"
      ONLINE_MODE: "FALSE"
      PATCH_DEFINITIONS: "/patches"
      REPLACE_ENV_VARIABLE_PREFIX: "CFG_"
      CFG_FORWARDING_SECRET: "${FORWARDING_SECRET:?run `cloud apply` to generate one}"
      MODRINTH_PROJECTS: "proxy-compatible-forge:1.3.1,create:6.0.10+mc1.21.1"
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      CLOUD_NETWORK: "modded-example"
      CLOUD_GROUP: "create"
      CLOUD_INSTANCE: "create"
      CLOUD_INSTANCE_INDEX: "1"
      CLOUD_GROUP_SIZE: "1"
      CLOUD_STATIC: "true"
      CLOUD_FALLBACK: "lobby"
      CLOUD_GROUPS: "lobby,survival,create"
      CLOUD_SERVERS: "lobby,survival,create"
      CLOUD_PROXY: "modded-example-proxy"
    expose:
      - "25565"
    volumes:
      - ./data/create:/data
      - ./proxy/patches/neoforge:/patches:ro
    networks: [cloud]

networks:
  cloud:
    driver: bridge

volumes:
  proxy-data:
  lobby-data:
